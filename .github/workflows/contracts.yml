name: Validate product contracts

on:
  pull_request:
    paths:
      - "catalog/**"
      - "product/**"
      - "resources/versions.yaml"
      - "plugin.cfg"
      - "addons/godot-minigame/plugin.cfg"
      - "tools/product/**"
      - "tests/product/**"
      - ".github/workflows/contracts.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "catalog/**"
      - "product/**"
      - "resources/versions.yaml"
      - "plugin.cfg"
      - "addons/godot-minigame/plugin.cfg"
      - "tools/product/**"
      - "tests/product/**"
      - ".github/workflows/contracts.yml"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.3"
      - name: Validate product contracts
        run: python tools/product/product.py validate
      - name: Verify generated template index
        run: python tools/product/product.py render-versions --check
      - name: Run product tool tests
        run: python -m unittest discover -s tests/product -v
