name: Release Godot Minigame plugin

on:
  push:
    tags:
      - "plugin-v*"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.3"
      - name: Validate tag and product contracts
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python tools/product/product.py validate
          version="$(python -c 'import json; print(json.load(open("product/plugin.json", encoding="utf-8"))["version"])')"
          test "$GITHUB_REF_NAME" = "plugin-v$version"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x86_64
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: macos-14
            platform: macos
            arch: universal
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.3"
      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons==4.9.1
      - name: Build native plugin
        run: scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_release embed_resources=yes
      - name: Upload native library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-bin-${{ matrix.platform }}
          path: dist/plugin/native/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.3"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-bin-windows
          path: dist/plugin/native/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-bin-linux
          path: dist/plugin/native/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-bin-macos
          path: dist/plugin/native/macos
      - name: Package installable addon
        run: python tools/product/product.py package-plugin --require-binaries
      - name: Build release update manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          repository = os.environ["REPOSITORY"]
          archive = Path(f"dist/plugin/godot-minigame-plugin-{version}.zip")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          url = f"https://github.com/{repository}/releases/download/plugin-v{version}/{archive.name}"
          asset = {"asset": archive.name, "url": url, "sha256": digest}
          manifest = {
              "schema_version": 1,
              "product": "godot-minigame",
              "channel": "stable",
              "published": True,
              "version": version,
              "tag": f"plugin-v{version}",
              "platforms": {
                  "windows-x86_64": asset,
                  "linux-x86_64": asset,
                  "macos-universal": asset,
              },
          }
          Path("dist/plugin/plugin-update.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Create immutable plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/plugin/godot-minigame-plugin-*.zip \
            dist/plugin/godot-minigame-plugin-*.zip.sha256 \
            dist/plugin/plugin-update.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "Godot Minigame plugin ${{ needs.validate.outputs.version }}" \
            --notes "Installable all-platform Godot editor plugin."

  promote:
    name: Promote catalog to stable
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.3"
      - name: Download release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern plugin-update.json --dir dist/plugin/release-assets
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body > dist/plugin/release-assets/release-notes.md
      - name: Update plugin catalog
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/plugin/release-assets/plugin-update.json").read_text(encoding="utf-8"))
          notes = Path("dist/plugin/release-assets/release-notes.md").read_text(encoding="utf-8").strip()
          catalog = {
              "schema_version": manifest["schema_version"],
              "product": manifest["product"],
              "channel": manifest["channel"],
              "published": True,
              "version": manifest["version"],
              "tag": manifest["tag"],
              "changelog": notes,
              "platforms": manifest["platforms"],
          }
          Path("catalog/plugin-stable.json").write_text(
              json.dumps(catalog, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY
          python tools/product/product.py validate
      - name: Commit catalog to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add catalog/plugin-stable.json
          git commit -m "promote: $GITHUB_REF_NAME"
          git push origin main
