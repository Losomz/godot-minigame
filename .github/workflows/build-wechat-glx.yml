name: Build WeChat GLX 2D template

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Immutable artifact revision
        required: true
        default: "1"
        type: string
      release_mode:
        description: Build only, or create the 4.5.2 prerelease
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - prerelease
      expected_tpz_sha256:
        description: Required for prerelease; must match the locally built TPZ
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: wechat-glx-4.5.2-r${{ inputs.revision }}
  cancel-in-progress: false

env:
  SOURCE_BRANCH: "4.5"
  RELEASE_TAG: "4.5.2"
  EMSCRIPTEN_VERSION: "4.0.10"
  EMSDK_COMMIT: "62a853cd3b3134398ce85cde8bb5cbb2ef0194cb"
  GODOT_COMMIT: "97fc04e67a6b583491230f2a24003415cedad078"
  GODOT_BASE: "6ce3de25aa58466e14ef354703ba8d9791a417da"

jobs:
  build:
    name: Build and package
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          $revision = "${{ inputs.revision }}"
          if ($revision -notmatch '^[1-9][0-9]*$') {
              throw "revision must be a positive integer"
          }

          if ("${{ inputs.release_mode }}" -eq "prerelease") {
              $expected = "${{ inputs.expected_tpz_sha256 }}".Trim()
              if ($expected -notmatch '^[0-9A-Fa-f]{64}$') {
                  throw "expected_tpz_sha256 must be a 64-character SHA-256 for prerelease"
              }
          }

      - name: Checkout adapter source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Checkout pinned Godot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git submodule sync -- godot
          if ($LASTEXITCODE -ne 0) { throw "git submodule sync failed" }

          git submodule update --init --depth 8 -- godot
          if ($LASTEXITCODE -ne 0) { throw "Godot submodule checkout failed" }

          $head = (git -C godot rev-parse HEAD).Trim()
          if ($head -ne $env:GODOT_COMMIT) {
              throw "Unexpected Godot commit: $head"
          }

          git -C godot merge-base --is-ancestor $env:GODOT_BASE HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "Godot checkout does not contain the pinned 4.5.2 base"
          }

          $dirty = git -C godot status --porcelain --untracked-files=all
          if ($dirty) {
              throw "Godot submodule is dirty: $dirty"
          }

      - name: Set up bootstrap Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.3"

      - name: Checkout pinned emsdk manager
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: emscripten-core/emsdk
          ref: ${{ env.EMSDK_COMMIT }}
          path: .ci-emsdk
          fetch-depth: 1
          persist-credentials: false

      - name: Install Emscripten and build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $emsdk = Join-Path $env:GITHUB_WORKSPACE ".ci-emsdk"

          python "$emsdk\emsdk.py" install $env:EMSCRIPTEN_VERSION
          if ($LASTEXITCODE -ne 0) { throw "emsdk install failed" }

          python "$emsdk\emsdk.py" activate $env:EMSCRIPTEN_VERSION
          if ($LASTEXITCODE -ne 0) { throw "emsdk activate failed" }

          & "$env:GITHUB_WORKSPACE\adapter\scripts\build_wechat_glx.ps1" `
              -EmsdkPath $emsdk `
              -Revision ([int]"${{ inputs.revision }}")
          if ($LASTEXITCODE -ne 0) { throw "WeChat GLX build failed" }

      - name: Verify release identity
        shell: pwsh
        run: |
          $revision = [int]"${{ inputs.revision }}"
          $stem = "minigame4.5.2-glx-2d-r$revision"
          $tpz = Join-Path $env:GITHUB_WORKSPACE "dist\$stem.tpz"
          if (-not (Test-Path $tpz)) { throw "Missing TPZ: $tpz" }

          $actual = (Get-FileHash $tpz -Algorithm SHA256).Hash.ToUpperInvariant()
          if ("${{ inputs.release_mode }}" -eq "prerelease") {
              $expected = "${{ inputs.expected_tpz_sha256 }}".Trim().ToUpperInvariant()
              if ($actual -ne $expected) {
                  throw "CI TPZ SHA-256 $actual does not match local candidate $expected"
              }
          }

          $sourceCommit = (git rev-parse HEAD).Trim()
          "ARTIFACT_STEM=$stem" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TPZ_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "TPZ SHA-256: $actual"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_STEM }}
          path: |
            dist/${{ env.ARTIFACT_STEM }}.tpz
            dist/${{ env.ARTIFACT_STEM }}.build-info.md
            dist/${{ env.ARTIFACT_STEM }}.profile.json
            dist/${{ env.ARTIFACT_STEM }}.sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create prerelease
        if: inputs.release_mode == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              throw "Release $env:RELEASE_TAG already exists; immutable release creation refused"
          }

          $notes = @"
          First reproducible Godot 4.5.2 WeChat GLX 2D template candidate.

          - Variant: glx-2d
          - Revision: r${{ inputs.revision }}
          - TPZ SHA-256: $env:TPZ_SHA256
          - Profile: adapter/configs/wechat_2d.py
          - Validation: build/profile/WASM ABI/Brotli/TPZ gates passed
          - Device status: same-package real-device smoke test pending

          This release remains a prerelease until the exact TPZ asset passes the device smoke test.
          "@

          $assets = @(
              "dist\$env:ARTIFACT_STEM.tpz",
              "dist\$env:ARTIFACT_STEM.build-info.md",
              "dist\$env:ARTIFACT_STEM.profile.json",
              "dist\$env:ARTIFACT_STEM.sha256.txt"
          )
          & gh release create $env:RELEASE_TAG @assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:SOURCE_COMMIT `
              --title "Godot 4.5.2 WeChat GLX 2D templates" `
              --prerelease `
              --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Prerelease creation failed" }
