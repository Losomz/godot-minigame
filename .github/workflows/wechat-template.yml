name: 微信模板 CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: build template, or promote a released template into the catalog
        required: true
        default: build
        type: choice
        options:
          - build
          - promote
      source_ref:
        description: "构建: adapter/adapters.json 中登记的适配分支"
        required: false
        default: "4.5"
        type: string
      revision:
        description: "构建: immutable artifact revision"
        required: false
        default: "1"
        type: string
      release_mode:
        description: "构建: 仅上传 Artifact，或从允许生产发布的适配分支创建 prerelease"
        required: false
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - prerelease
      expected_tpz_sha256:
        description: "构建: optional local TPZ SHA-256 reproducibility gate"
        required: false
        default: ""
        type: string
      include_ad:
        description: "构建: 融合微信广告组件(adapter/wechat_ad),产物为 -ad 变体;默认开启,仅明确需要无广告模板时改为 false"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "提升: exact <version>-<variant>-rN Release tag to promote, for example 4.5.2-glx-2d-r1"
        required: false
        type: string
      godot_major:
        description: "提升: catalog bucket, for example godot4"
        required: false
        default: godot4
        type: string
      godot_version:
        description: "提升: exact Godot version, for example 4.5.2"
        required: false
        type: string
      source_branch:
        description: "提升: adapter production branch"
        required: false
        type: string
      source_commit:
        description: "提升: full adapter source commit used by the Release"
        required: false
        type: string
      minimum_plugin:
        description: "提升: minimum compatible plugin version"
        required: false
        default: "1.0.4"
        type: string
      status:
        description: "提升: catalog state"
        required: false
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable

permissions: {}

concurrency:
  group: wechat-template-${{ inputs.mode }}-${{ inputs.release_tag || inputs.source_ref }}
  cancel-in-progress: false

env:
  EMSDK_COMMIT: "62a853cd3b3134398ce85cde8bb5cbb2ef0194cb"

jobs:
  resolve:
    name: Resolve adapter build contract
    if: inputs.mode == 'build'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.contract.outputs.branch }}
      build: ${{ steps.contract.outputs.build }}
      runner: ${{ steps.contract.outputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Resolve registered branch contract
        id: contract
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          INCLUDE_AD: ${{ inputs.include_ad }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source_ref = os.environ["SOURCE_REF"]
          adapters = json.loads(Path("adapter/adapters.json").read_text(encoding="utf-8"))["adapters"]
          adapter = next((item for item in adapters if item.get("branch") == source_ref), None)
          if adapter is None:
              raise SystemExit(f"{source_ref!r} is not a registered adapter branch")

          build = adapter.get("build")
          if not isinstance(build, dict):
              raise SystemExit(
                  f"Adapter {source_ref} is {adapter.get('status', 'unknown')} and has no build contract"
              )
          if os.environ["RELEASE_MODE"] == "prerelease" and not build.get("production"):
              raise SystemExit(f"Adapter {source_ref} is not allowed to publish template releases")
          if os.environ["INCLUDE_AD"] == "true" and not build.get("supports_ad"):
              raise SystemExit(f"Adapter {source_ref} does not support the ad template variant")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"branch={source_ref}\n")
              handle.write(f"runner={build['runner']}\n")
              handle.write("build=" + json.dumps(build, separators=(",", ":")) + "\n")
          PY

  build:
    name: Build and package ${{ inputs.source_ref }}
    if: inputs.mode == 'build'
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      artifact_stem: ${{ steps.identity.outputs.artifact_stem }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release_title: ${{ steps.identity.outputs.release_title }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      source_slug: ${{ steps.identity.outputs.source_slug }}
      tpz_sha256: ${{ steps.identity.outputs.tpz_sha256 }}

    steps:
      - name: Validate inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_TPZ_SHA256: ${{ inputs.expected_tpz_sha256 }}
        shell: pwsh
        run: |
          # Patch files must retain their Git-blob LF endings for git apply checks.
          git config --global core.autocrlf false

          $sourceRef = $env:SOURCE_REF.Trim()
          if (-not $sourceRef -or $sourceRef -ne $env:SOURCE_REF) {
              throw "source_ref must be a non-empty branch name without surrounding whitespace"
          }
          if ($sourceRef.Contains("@{")) {
              throw "source_ref contains a forbidden ref expression"
          }
          git check-ref-format --branch $sourceRef *> $null
          if ($LASTEXITCODE -ne 0) {
              throw "source_ref is not a valid branch name: $sourceRef"
          }

          $revision = "${{ inputs.revision }}"
          if ($revision -notmatch '^[1-9][0-9]*$') {
              throw "revision must be a positive integer"
          }

          $expected = $env:EXPECTED_TPZ_SHA256.Trim()
          if ($expected -and $expected -notmatch '^[0-9A-Fa-f]{64}$') {
              throw "expected_tpz_sha256 must be empty or a 64-character SHA-256"
          }

      - name: Checkout selected adapter branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Verify selected branch contract
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          REGISTERED_BRANCH: ${{ needs.resolve.outputs.branch }}
          ADAPTER_BUILD: ${{ needs.resolve.outputs.build }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $contract = $env:ADAPTER_BUILD | ConvertFrom-Json
          foreach ($path in $contract.required_paths) {
              if (-not (Test-Path $path -PathType Leaf)) {
                  throw "source_ref $env:SOURCE_REF violates its build contract; missing $path"
              }
          }

          if ($env:SOURCE_REF -ne $env:REGISTERED_BRANCH) {
              throw "source_ref $env:SOURCE_REF differs from registered branch $env:REGISTERED_BRANCH"
          }

          $sourceCommit = (git rev-parse HEAD).Trim()
          $remoteLine = git ls-remote --heads origin "refs/heads/$env:SOURCE_REF"
          if ($LASTEXITCODE -ne 0 -or -not $remoteLine) {
              throw "source_ref does not resolve to a remote branch: $env:SOURCE_REF"
          }
          $remoteCommit = (($remoteLine | Select-Object -First 1) -split '\s+')[0].Trim()
          if ($sourceCommit -ne $remoteCommit) {
              throw "checked-out commit $sourceCommit differs from remote branch $remoteCommit"
          }

          $manifest = Get-Content -Raw $contract.manifest_path | ConvertFrom-Json
          $godotCommit = "$($manifest.PSObject.Properties[$contract.godot_commit_field].Value)".Trim()
          $godotBase = "$($manifest.PSObject.Properties[$contract.godot_base_field].Value)".Trim()
          if ($godotCommit -notmatch '^[0-9a-f]{40}$' -or $godotBase -notmatch '^[0-9a-f]{40}$') {
              throw "adapter manifest must contain full Godot base and adapter commits"
          }
          $emscripten = "$($manifest.toolchain.emscripten)".Trim()
          if (-not $emscripten) {
              throw "adapter manifest must pin toolchain.emscripten"
          }

          "SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_GODOT_COMMIT=$godotCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GODOT_BASE=$godotBase" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EMSCRIPTEN_VERSION=$emscripten" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_SCRIPT=$($contract.build_script)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_PROFILE=$($contract.profile)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout branch-pinned Godot source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git submodule sync -- adapter/thirdparty/godot
          if ($LASTEXITCODE -ne 0) { throw "git submodule sync failed" }

          git submodule update --init --depth 8 -- adapter/thirdparty/godot
          if ($LASTEXITCODE -ne 0) { throw "Godot submodule checkout failed" }

          $head = (git -C adapter/thirdparty/godot rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_GODOT_COMMIT) {
              throw "Godot gitlink $head differs from manifest $env:EXPECTED_GODOT_COMMIT"
          }

          git -C adapter/thirdparty/godot merge-base --is-ancestor $env:GODOT_BASE HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "Godot checkout does not contain the branch manifest base $env:GODOT_BASE"
          }

          $dirty = git -C adapter/thirdparty/godot status --porcelain --untracked-files=all
          if ($dirty) {
              throw "Godot submodule is dirty: $dirty"
          }

      - name: Set up bootstrap Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.3"

      - name: Checkout pinned emsdk manager
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: emscripten-core/emsdk
          ref: ${{ env.EMSDK_COMMIT }}
          path: .ci-emsdk
          fetch-depth: 1
          persist-credentials: false

      - name: Install Emscripten and build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $emsdk = Join-Path $env:GITHUB_WORKSPACE ".ci-emsdk"

          python "$emsdk\emsdk.py" install $env:EMSCRIPTEN_VERSION
          if ($LASTEXITCODE -ne 0) { throw "emsdk install failed" }

          python "$emsdk\emsdk.py" activate $env:EMSCRIPTEN_VERSION
          if ($LASTEXITCODE -ne 0) { throw "emsdk activate failed" }

          $buildScript = Join-Path $env:GITHUB_WORKSPACE $env:BUILD_SCRIPT
          if ("${{ inputs.include_ad }}" -eq "false") {
              & $buildScript -EmsdkPath $emsdk -Revision ([int]"${{ inputs.revision }}") -Profile $env:BUILD_PROFILE
          } else {
              & $buildScript -EmsdkPath $emsdk -Revision ([int]"${{ inputs.revision }}") -Profile $env:BUILD_PROFILE -Ad
          }
          if ($LASTEXITCODE -ne 0) { throw "WeChat GLX build failed" }

      - name: Verify artifact identity
        id: identity
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_TPZ_SHA256: ${{ inputs.expected_tpz_sha256 }}
        shell: pwsh
        run: |
          $legacyDist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $templateDist = Join-Path $legacyDist "template"
          New-Item -ItemType Directory -Path $templateDist -Force | Out-Null
          $built = Get-ChildItem -LiteralPath $legacyDist -Filter "*.tpz" -File
          if ($built.Count -ne 1) { throw "Expected exactly one built TPZ under dist/, found $($built.Count)" }
          $stem = $built[0].BaseName
          if (-not $stem.StartsWith("minigame")) { throw "Unexpected template stem: $stem" }
          foreach ($suffix in @("tpz", "build-info.md", "profile.json", "sha256.txt")) {
              $source = Join-Path $legacyDist "$stem.$suffix"
              if (-not (Test-Path $source -PathType Leaf)) { throw "Missing template output: $source" }
              Move-Item -LiteralPath $source -Destination $templateDist -Force
          }
          $tpz = Join-Path $templateDist "$stem.tpz"
          if (-not (Test-Path $tpz -PathType Leaf)) { throw "Missing TPZ: $tpz" }

          $actual = (Get-FileHash $tpz -Algorithm SHA256).Hash.ToUpperInvariant()
          $expected = $env:EXPECTED_TPZ_SHA256.Trim().ToUpperInvariant()
          $hashMatches = -not $expected -or $actual -eq $expected
          if (-not $hashMatches) {
              Write-Warning "CI TPZ SHA-256 $actual does not match local candidate $expected"
          }

          $slug = $env:SOURCE_REF.ToLowerInvariant()
          $slug = [regex]::Replace($slug, '[^a-z0-9._-]+', '-')
          $slug = $slug.Trim([char[]]'-.')
          if (-not $slug) { throw "source_ref does not produce a usable release slug" }
          if ($slug.Length -gt 48) { $slug = $slug.Substring(0, 48).TrimEnd('-') }

          $shortCommit = $env:SOURCE_COMMIT.Substring(0, 7)
          $releaseTag = $stem.Substring("minigame".Length)
          $releaseTitle = "Godot template $releaseTag"
          $artifactName = "$stem-$slug-$shortCommit"

          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_stem=$stem" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_title=$releaseTitle" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_commit=$env:SOURCE_COMMIT" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_slug=$slug" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tpz_sha256=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "hash_matches=$($hashMatches.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Source: $env:SOURCE_REF@$env:SOURCE_COMMIT"
          Write-Host "Release tag: $releaseTag"
          Write-Host "TPZ SHA-256: $actual"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: |
            dist/template/${{ steps.identity.outputs.artifact_stem }}.tpz
            dist/template/${{ steps.identity.outputs.artifact_stem }}.build-info.md
            dist/template/${{ steps.identity.outputs.artifact_stem }}.profile.json
            dist/template/${{ steps.identity.outputs.artifact_stem }}.sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Enforce expected TPZ SHA-256
        if: steps.identity.outputs.hash_matches != 'true'
        env:
          ACTUAL_TPZ_SHA256: ${{ steps.identity.outputs.tpz_sha256 }}
          EXPECTED_TPZ_SHA256: ${{ inputs.expected_tpz_sha256 }}
        shell: pwsh
        run: |
          throw "CI TPZ SHA-256 $env:ACTUAL_TPZ_SHA256 does not match expected $env:EXPECTED_TPZ_SHA256"

  release:
    name: Create prerelease ${{ needs.build.outputs.release_tag }}
    if: inputs.mode == 'build' && inputs.release_mode == 'prerelease'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/template/release-assets

      - name: Verify downloaded TPZ
        env:
          ARTIFACT_STEM: ${{ needs.build.outputs.artifact_stem }}
          TPZ_SHA256: ${{ needs.build.outputs.tpz_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          tpz="dist/template/release-assets/${ARTIFACT_STEM}.tpz"
          test -f "$tpz"
          actual="$(sha256sum "$tpz" | awk '{print toupper($1)}')"
          test "$actual" = "$TPZ_SHA256"

          for suffix in build-info.md profile.json sha256.txt; do
              test -f "dist/template/release-assets/${ARTIFACT_STEM}.${suffix}"
          done

      - name: Create immutable template prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_STEM: ${{ needs.build.outputs.artifact_stem }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.build.outputs.release_title }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TPZ_SHA256: ${{ needs.build.outputs.tpz_sha256 }}
          INCLUDE_AD: ${{ inputs.include_ad }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG already exists; immutable release creation refused"
              exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Tag $RELEASE_TAG already exists; immutable release creation refused"
              exit 1
          fi

          if [ "${INCLUDE_AD}" = "true" ]; then
              ad_note='- Ad layer: merged adapter/wechat_ad component'
          else
              ad_note='- Ad layer: not included'
          fi
          notes="$(printf '%s\n' \
            "Reproducible WeChat minigame template ${RELEASE_TAG} candidate." \
            '' \
            "- Source branch: ${SOURCE_REF}" \
            "- Source commit: ${SOURCE_COMMIT}" \
            "- Artifact: ${ARTIFACT_STEM}.tpz" \
            "${ad_note}" \
            "- TPZ SHA-256: ${TPZ_SHA256}" \
            '- Validation: build/profile/WASM ABI/Brotli/TPZ gates passed' \
            '' \
            'This release remains a prerelease until the exact TPZ asset passes the device smoke test.')"

          gh release create "$RELEASE_TAG" \
            "dist/template/release-assets/${ARTIFACT_STEM}.tpz" \
            "dist/template/release-assets/${ARTIFACT_STEM}.build-info.md" \
            "dist/template/release-assets/${ARTIFACT_STEM}.profile.json" \
            "dist/template/release-assets/${ARTIFACT_STEM}.sha256.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "$RELEASE_TITLE" \
            --prerelease \
            --latest=false \
            --notes "$notes"

  promote:
    name: Promote ${{ inputs.release_tag }}
    if: inputs.mode == 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.3"
      - name: Sync with origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Verify immutable Release and source identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GODOT_VERSION: ${{ inputs.godot_version }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          STATUS: ${{ inputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^${GODOT_VERSION}-[a-z0-9]+(-[a-z0-9]+)*-r[1-9][0-9]*$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          python - "$SOURCE_BRANCH" "$GODOT_VERSION" <<'PY'
          import json
          import sys

          source_branch, godot_version = sys.argv[1:]
          with open("adapter/adapters.json", encoding="utf-8") as handle:
              adapters = json.load(handle)["adapters"]
          adapter = next(
              (
                  entry
                  for entry in adapters
                  if entry.get("branch") == source_branch
                  and entry.get("godot_version") == godot_version
              ),
              None,
          )
          if adapter is None:
              raise SystemExit(
                  f"{source_branch} is not the registered template source for Godot {godot_version}"
              )
          build = adapter.get("build")
          if not isinstance(build, dict) or not build.get("production"):
              raise SystemExit(f"{source_branch} is not registered for production template releases")
          PY

          draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          prerelease="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          target="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          test "$draft" = "false"
          test "$target" = "$SOURCE_COMMIT"
          if [[ "$STATUS" = stable ]]; then
              test "$prerelease" = "false"
          fi

          remote_commit="$(git ls-remote --heads origin "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')"
          test -n "$remote_commit"
          git fetch --no-tags origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/template-source"
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/template-source

          mkdir -p dist/template/release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tpz' --dir dist/template/release-assets
          mapfile -t assets < <(find dist/template/release-assets -maxdepth 1 -type f -name '*.tpz' -printf '%f\n')
          test "${#assets[@]}" -eq 1
          asset="${assets[0]}"
          digest="$(sha256sum "dist/template/release-assets/$asset" | awk '{print $1}')"
          printf 'TEMPLATE_ASSET=%s\nTEMPLATE_SHA256=%s\n' "$asset" "$digest" >> "$GITHUB_ENV"
      - name: Update canonical catalog and generated fallback
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GODOT_MAJOR: ${{ inputs.godot_major }}
          GODOT_VERSION: ${{ inputs.godot_version }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          MINIMUM_PLUGIN: ${{ inputs.minimum_plugin }}
          STATUS: ${{ inputs.status }}
        run: |
          python tools/product/product.py promote-template \
            --godot-major "$GODOT_MAJOR" \
            --godot-version "$GODOT_VERSION" \
            --tag "$RELEASE_TAG" \
            --file "$TEMPLATE_ASSET" \
            --sha256 "$TEMPLATE_SHA256" \
            --minimum-plugin "$MINIMUM_PLUGIN" \
            --source-branch "$SOURCE_BRANCH" \
            --source-commit "$SOURCE_COMMIT" \
            --status "$STATUS"
          python tools/product/product.py validate
      - name: Commit catalog to main
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/catalog/templates.json plugin/resources/versions.yaml
          git commit -m "提升: $RELEASE_TAG"
          git push origin HEAD:main
